name: Comparator verification

on:
  # This verification is intentionally expensive and manual-only.
  # Pushes and pull requests do not trigger it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build, Comparator, and NanoDa
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache: false

      - name: Free disk space for the verification run
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Fetch pinned Mathlib cache artifacts
        run: lake exe cache get

      - name: Build the substantive library
        run: lake build OptimalConvergenceRates

      - name: Build the Comparator solution module
        run: lake build Comparator

      - name: Run pinned Comparator checks
        env:
          COMPARATOR_CACHE: ${{ runner.temp }}/comparator-preflight
        run: ./scripts/verify-comparator.sh
