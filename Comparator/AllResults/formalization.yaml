# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"
project:
  name: "Formalized optimal convergence rates for sums-of-squares hierarchies"
  description: >-
    A Lean 4 development presenting proofs of the ten result groups announced
    in a forthcoming companion manuscript, together with explicit dimension-
    and degree-dependent bounds for homogeneous polynomials on the sphere.
    The announced results give asymptotically
    optimal upper and lower certificate-degree bounds for Archimedean quadratic
    modules and compact preorderings, quartic hypercube and equality-aware CQC upper bounds,
    sharp lower bounds for explicit hypercube witnesses, and a quadratic lower
    bound under MFCQ.
  authors:
    - "Lucas Slot"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lucas Slot"
classification:
  arxiv: ["math.OC"]
  msc2020: ["14P10", "90C23"]
sources:
  - title: "Optimal degree bounds for sum-of-squares representations"
    authors:
      - "Alexander Taveira Blomenhofer"
      - "Sander Gribling"
      - "Didier Henrion"
      - "Milan Korda"
      - "Poornendu Kumar"
      - "Victor Magron"
      - "Lucas Slot"
      - "Luis Felipe Vargas"
      - "Juan Vera"
    type: "original-proof"
    relationship: "other"
    note: >-
      This source contains the ten announced result groups. No arXiv or DOI
      identifier is available yet; a PDF is included in the repository as
      Announcement.pdf. The mathematical proofs were found
      through a mix of human and AI contributions, with human oversight by all
      nine source authors. Detailed model attribution is unavailable.
      These proofs are first presented through the formalization project.
  - title: "Dimension-aware homogeneous sphere bounds (PR #4)"
    authors:
      - "a44l"
    type: "original-proof"
    relationship: "other"
    note: >-
      Mathematical proofs and Lean arguments from
      https://github.com/Lucas-Slot/OptimalConvergenceRates/pull/4,
      commit 0b1429cba361a97ac7a9733f75bf0f5f02bda928, integrated with the
      existing sphere certificate, extrema, and hierarchy definitions.
status:
  scope: >-
    The single Comparator surface contains twenty-five advertised theorems:
    twenty-two covering the ten announced result groups and three explicit
    homogeneous sphere bounds. It also includes positivity theorems for the two
    separation constants used in the Choi--Lam and Motzkin lower bounds, and the two corresponding
    definitions. Supporting definitions, lemmas, equivalent consequences, and
    results not listed in README.md are outside the compared surface unless
    needed to ensure those lower bounds are nonvacuous.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
automation:
  methods:
    - method: "agent"
      models: ["Claude"]
      framework: "Claude Code"
      tool_setup: >-
        Near-exclusive AI-assisted mathematical-argument and Lean proof
        development under human direction, using Lean and Mathlib feedback.
    - method: "agent"
      models: ["Codex"]
      framework: "Codex"
      tool_setup: >-
        Near-exclusive AI-assisted mathematical-argument development, Lean
        implementation, refactoring, and verification under human direction.
  spend_usd: "not tracked"
  notes: >-
    Lucas Slot is the sole human author and maintainer of the Lean
    formalization. He selected the statements, directed the work, maintained
    the repository, and reviewed the generated code. Claude Code and Codex
    performed almost all mathematical-argument development and Lean
    implementation. The source proofs were found through a mix of human and AI
    contributions, with human oversight by all nine source authors. Their
    detailed AI-model provenance is unavailable.
fidelity:
  divergences: >-
    The announcement uses k for a relaxation order whose certificates have
    degree at most 2k, whereas most Lean statements use r for the total degree
    of each complete SOS-weighted certificate term. This changes fixed
    constants but not the asymptotic rates. The hypercube upper bound keeps the
    dependence on the polynomial supremum norm and max(d,1)^6 explicit. Lean
    also states nonemptiness and positive dimension/cardinality hypotheses
    explicitly in the LICQ result. The MFCQ development encodes paper order r
    as certificate degree 2r. The additional homogeneous sphere statements use
    r as the degree of each SOS square root, matching the existing sphere
    hierarchy. Their quantitative estimates supplement the announcement.
    No other known mathematical divergence affects the compared statements.
review:
  status: "self-assessed"
  notes: >-
    Lucas Slot reviewed the public Lean statements and generated proof
    development. No independent human peer review of the Lean code or the
    mathematical arguments is claimed. All nine source authors provided human
    oversight of mathematical proof development.
alignment:
  namespace: "OptimalConvergenceRates"
  statements:
    - source: "Archimedean, upper degree bound (THM:generalputinarupper)"
      lean: "OptimalConvergenceRates.GeneralArchimedean.generalArchimedeanUpperRate"
      module: "Comparator.AllResults.Solution"
      status: "proved"
      note: "Rate form: O(log(r)^4 / r^2) perturbation in an Archimedean quadratic module."
    - source: "Archimedean, upper degree bound (THM:generalputinarupper)"
      lean: "OptimalConvergenceRates.GeneralArchimedean.generalArchimedeanEpsilonCertificate"
      module: "Comparator.AllResults.Solution"
      status: "proved"
      note: "Inverse form: O(epsilon^(-1/2) log(1/epsilon)^2) certificate degree."
    - source: "Archimedean, lower degree bound (THM:generalputinarlower)"
      lean: "OptimalConvergenceRates.GeneralArchimedean.sharpArchimedeanRate"
      module: "Comparator.AllResults.Solution"
      status: "proved"
      note: "Matching upper and lower rate for the explicit three-variable Archimedean example."
    - source: "Archimedean, lower degree bound (THM:generalputinarlower)"
      lean: "OptimalConvergenceRates.GeneralArchimedean.sharpArchimedeanDegreeLowerBound"
      module: "Comparator.AllResults.Solution"
      status: "proved"
      note: "Matching certificate-degree lower bound for the explicit Archimedean example."
    - source: "Compact, upper degree bound (THM:generalschmudgenupper)"
